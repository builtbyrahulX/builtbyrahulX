name: Generate Stats SVG

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: vertex.dev
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          filename: stats.svg
          output_action: commit
          committer_branch: stats-output
          committer_message: "chore: update stats"
          config_output: svg